<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập | Serene Care</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            darkMode: "class",

                extend: {
                    "colors": {
                        "surface-container": "#f0eded",

                        "on-error": "#ffffff",

                        "on-tertiary-fixed-variant": "#005048",
                        "on-primary": "#ffffff",
                        "surface-bright": "#fcf9f8",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e4e2e1",
                        "secondary-fixed": "#94f990",
                        "primary-fixed-dim": "#bdc2ff",
                        "inverse-primary": "#bdc2ff",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#dfe0ff",
                        "tertiary-fixed": "#85f6e5",
                        "surface": "#fcf9f8",
                        "on-surface-variant": "#454655",
                        "surface-variant": "#e4e2e1",

                        "on-secondary-container": "#00731e",

                        "surface-container-low": "#f6f3f2",
                        "tertiary": "#00685e",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface min-h-screen flex items-center justify-center p-4 md:p-8">
<main class="w-full max-w-6xl">
<div class="grid grid-cols-1 md:grid-cols-2 bg-surface-container-lowest rounded-xl overflow-hidden shadow-[0px_12px_32px_rgba(27,28,28,0.06)] min-h-[700px]">
<section class="relative hidden md:block overflow-hidden">
<img alt="Calming healthcare background" class="absolute inset-0 w-full h-full object-cover" data-alt="Modern bright healthcare clinic interior with soft natural light, minimalist furniture, and a peaceful atmosphere in pastel tones" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBDw5gQM_9bD5cKY_r7hCccSILqIsWWEaMNDm-4zIVoj2V1uFnTKtRqsBCGLitzAwyvhgNvyfKrTxZ61K0W89T4gJzk7D9Znsawx8yg32ufCNY-63sUp6WemnxUqYv1Pn2jYanIWdxw0bPwmsqAqzbMSfG9j6vzWmChRfetpkWSc71t_anWI7kCUvfuRCI1hfTOuPMzYqaJET34c2d_m1RyKJpIsTYg_kBGm2Eyei01gfZw23C-u_trK7koxy6axcujP0WewiRy9r0"/>
<div class="absolute inset-0 bg-gradient-to-tr from-primary/40 to-transparent flex flex-col justify-end p-12">
<div class="glass-panel p-8 rounded-lg max-w-sm">
<h2 class="font-headline text-3xl font-bold text-primary mb-4 tracking-tight">Serene Care</h2>
<p class="text-on-surface-variant font-medium leading-relaxed">
                            Trải nghiệm sự xuất sắc về lâm sàng trong một không gian kỹ thuật số yên bình. Hành trình hồi phục của bạn bắt đầu bằng sự rõ ràng và an tâm.
                        </p>
</div>
</div>
</section>
<section class="flex flex-col p-8 md:p-16 lg:p-20 justify-center">
<div class="max-w-md mx-auto w-full">
<header class="mb-10">
<h1 class="font-headline text-4xl font-extrabold text-on-surface mb-2 tracking-tight">Chào mừng trở lại</h1>
<p class="text-on-surface-variant">Vui lòng nhập thông tin để đăng nhập</p>
</header>
<form class="space-y-6">
<div class="space-y-1.5">
<label class="block font-label text-sm font-semibold text-on-surface-variant ml-1" for="email">Email hoặc Số điện thoại</label>
<input class="w-full bg-surface-container-low border-none rounded-md px-4 py-3.5 text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-highest transition-all outline-none" id="email" name="email" placeholder="martha.stewart@example.com" type="text"/>
</div>
<div class="space-y-1.5">
<label class="block font-label text-sm font-semibold text-on-surface-variant ml-1" for="password">Mật khẩu</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-md px-4 py-3.5 text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-highest transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20 bg-surface-container-low transition-all" type="checkbox"/>
<span class="ml-2.5 text-sm font-medium text-on-surface-variant group-hover:text-on-surface transition-colors">Ghi nhớ đăng nhập</span>
</label>
<a class="text-sm font-semibold text-primary hover:text-primary-container transition-colors" href="#">Quên mật khẩu?</a>
</div>
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-white font-headline font-bold py-4 rounded-md shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200" type="submit">
                            Đăng nhập
                        </button>
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-surface-container-lowest text-on-surface-variant/60 font-medium">Hoặc tiếp tục với</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-md border border-outline-variant/20 bg-surface-container-low hover:bg-surface-container-high transition-colors font-medium text-on-surface" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
<span class="hidden sm:inline">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-md border border-outline-variant/20 bg-surface-container-low hover:bg-surface-container-high transition-colors font-medium text-on-surface" type="button">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05 1.61-3.2 1.61-1.11 0-1.45-.69-2.79-.69s-1.74.67-2.8.67c-1.11 0-2.24-.72-3.32-1.78C2.69 17.9 1.1 13.9 1.1 10.74c0-3.37 2.1-5.14 4.14-5.14 1.07 0 2.02.66 2.7.66.65 0 1.77-.73 2.97-.73 1.25 0 2.41.45 3.19 1.4-.24.15-1.92 1.13-1.92 3.19 0 2.45 2.11 3.3 2.14 3.31-.03.07-.33 1.14-1.09 2.16-.65.93-1.33 1.84-2.18 1.84s-1.07-.64-2.28-.64c-1.2 0-1.47.62-2.27.64-.81.03-1.6-.96-2.25-1.91zM11.95 5.06c-.03-2.12 1.75-3.9 3.86-4.06.24 2.48-2.07 4.38-3.86 4.06z"></path>
</svg>
<span class="hidden sm:inline">Apple</span>
</button>
</div>
</form>
<footer class="mt-12 text-center">
<p class="text-on-surface-variant font-medium">
                            Chưa có tài khoản? 
                            <a class="text-primary font-bold hover:underline ml-1" href="#">Tạo tài khoản mới</a>
</p>
</footer>
</div>
</section>
</div>
</main>
</body></html>
